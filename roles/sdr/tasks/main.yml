---
- name: Installation et configuration de la suite SDR
  become: true
  become_user: root
  block:
    - name: Remove legacy and conflicting APT packages
      ansible.builtin.apt:
        name: "{{ sdr_packages_to_remove }}"
        state: absent
        purge: true

    - name: Install required build dependencies and packages
      ansible.builtin.apt:
        name: "{{ sdr_packages_to_install }}"
        update_cache: true
        state: present

    - name: Blacklist the native Linux DVB TV driver
      ansible.builtin.kernel_blacklist:
        name: dvb_usb_rtl28xxu
        state: present

    - name: Check which SDR binaries are already installed
      ansible.builtin.stat:
        path: "{{ item.binary }}"
      loop: "{{ sdr_compilations }}"
      register: sdr_binaries_stat

    - name: Download, compile and install SDR tools from source
      ansible.builtin.include_tasks: compile.yml
      loop: "{{ sdr_binaries_stat.results }}"
      when: not compilation_item.stat.exists
      loop_control:
        loop_var: compilation_item
        label: "{{ compilation_item.item.name }}"

    - name: Check if udev rules source exists before copying
      ansible.builtin.stat:
        path: "/tmp/rtl-sdr-blog/rtl-sdr.rules"
      register: udev_source_stat

    - name: Copy Osmocom udev rules to system directory
      ansible.builtin.copy:
        src: "/tmp/rtl-sdr-blog/rtl-sdr.rules"
        dest: "/etc/udev/rules.d/rtl-sdr.rules"
        remote_src: true
        mode: '0644'
      when: udev_source_stat.stat.exists

    - name: Force udev daemon to reload rules
      ansible.builtin.command: udevadm control --reload-rules
      changed_when: false
      when: udev_source_stat.stat.exists

    - name: Trigger udev modifications for connected devices
      ansible.builtin.command: udevadm trigger
      changed_when: false
      when: udev_source_stat.stat.exists

    - name: Clean up temporary build source files
      ansible.builtin.file:
        path: "{{ item.item.dest }}"
        state: absent
      loop: "{{ sdr_binaries_stat.results }}"
      loop_control:
        label: "{{ item.item.dest }}"
      when: not item.stat.exists
